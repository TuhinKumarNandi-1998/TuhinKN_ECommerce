version: '3.8'

services:
  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: ecommerce_app
      POSTGRES_PASSWORD: your_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: tuhinkumarnandistar/tuhinkn_ecommerce:v0.001 # name of your built image
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/ecommerce_db
      - DB_PASSWORD=your_db_password
      - JWT_SECRET=your_jwt_secret
      - STRIPE_SECRET_KEY=your_stripe_key
    depends_on:
      - postgres-db

volumes:
  postgres_data: