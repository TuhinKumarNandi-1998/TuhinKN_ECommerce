# ===========================================================
# TuhinKN E-Commerce - Kubernetes Deployment Manifest
# ===========================================================
# Includes:
#   1. Namespace
#   2. PostgreSQL Secret (credentials)
#   3. PostgreSQL PersistentVolumeClaim
#   4. PostgreSQL Deployment
#   5. Spring Boot App Deployment
# ===========================================================

# -----------------------------------------------------------
# 1. Namespace
# -----------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: tuhinkn-ecommerce
  labels:
    app: tuhinkn-ecommerce

---

# -----------------------------------------------------------
# 2. Secret — Database credentials & app secrets
#    (values are base64-encoded; update before production use)
#
#    To encode:  echo -n "your_value" | base64
# -----------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: tuhinkn-ecommerce-secret
  namespace: tuhinkn-ecommerce
  labels:
    app: tuhinkn-ecommerce
type: Opaque
data:
  # echo -n "ecommerce_db"       | base64  -> ZWNvbW1lcmNlX2Ri
  postgres-db: ZWNvbW1lcmNlX2Ri
  # echo -n "ecommerce_app"      | base64  -> ZWNvbW1lcmNlX2FwcA==
  postgres-user: ZWNvbW1lcmNlX2FwcA==
  # echo -n "your_db_password"   | base64  -> eW91cl9kYl9wYXNzd29yZA==
  postgres-password: eW91cl9kYl9wYXNzd29yZA==
  # echo -n "your_jwt_secret"    | base64  -> eW91cl9qd3Rfc2VjcmV0
  jwt-secret: eW91cl9qd3Rfc2VjcmV0
  # echo -n "your_stripe_key"    | base64  -> eW91cl9zdHJpcGVfa2V5
  stripe-secret-key: eW91cl9zdHJpcGVfa2V5

---

# -----------------------------------------------------------
# 3. PersistentVolumeClaim — PostgreSQL data volume
# -----------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: tuhinkn-ecommerce
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

# -----------------------------------------------------------
# 4. PostgreSQL Deployment
# -----------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: tuhinkn-ecommerce
  labels:
    app: postgres
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate          # ensures single write access to the PVC
  template:
    metadata:
      labels:
        app: postgres
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: postgres-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: postgres-password
            # Fix: Minikube PVC mounts create a lost+found dir at the root.
            # Postgres refuses to init in a non-empty directory.
            # PGDATA points it to a clean subdirectory instead.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Only readiness probe — never use liveness probe on a database.
          # A failing liveness probe would kill the DB pod mid-operation
          # and risk data corruption. Readiness probe is enough to
          # stop traffic routing until Postgres is fully ready.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ecommerce_app
                - -d
                - ecommerce_db
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5       # prevent 1s default timeout failures
            failureThreshold: 6
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---

# -----------------------------------------------------------
# 5. Spring Boot Application Deployment
# -----------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuhinkn-ecommerce-deployment
  namespace: tuhinkn-ecommerce
  labels:
    app: tuhinkn-ecommerce
    component: backend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: tuhinkn-ecommerce
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tuhinkn-ecommerce
        component: backend
    spec:
      # Wait for postgres to be ready before starting the app
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL to be ready...";
                sleep 3;
              done;
              echo "PostgreSQL is ready!"
      containers:
        - name: tuhinkn-ecommerce
          image: tuhinkumarnandistar/tuhinkn_ecommerce:v0.001
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/ecommerce_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: postgres-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: postgres-password
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: jwt-secret
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tuhinkn-ecommerce-secret
                  key: stripe-secret-key
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 3
